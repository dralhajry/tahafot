name: تحديث فيديوهات القناة
on:
  schedule:
    - cron: "17 */3 * * *"   # كل ثلاث ساعات
  workflow_dispatch: {}       # تشغيل يدوي من تبويب Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_videos.py
      - name: حفظ التغيير
        run: |
          if ! git diff --quiet -- videos.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add videos.json
            git commit -m "تحديث قائمة الفيديوهات"
            git push
          fi
